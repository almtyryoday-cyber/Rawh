name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create iOS project
        run: |
          mkdir -p ios/Rawh/Assets.xcassets/AppIcon.appiconset ios/Rawh/Assets.xcassets/LaunchBG.colorset
          # the SwiftUI app (whatever the file got named on upload)
          SRC=$( (grep -l "RAWH_JSON" ./*.swift || true) | head -n 1 )
          if [ -z "$SRC" ]; then echo "::error::Rawh.swift not found in the repo"; exit 1; fi
          echo "Using source: $SRC"
          cp "$SRC" ios/Rawh/Rawh.swift
          # app icon: icon-1024.png if uploaded, otherwise made from icon-512.png
          ICON=ios/Rawh/Assets.xcassets/AppIcon.appiconset/icon-1024.png
          if [ -f icon-1024.png ]; then cp icon-1024.png "$ICON"; else sips -z 1024 1024 icon-512.png --out "$ICON"; fi
          echo '{"info":{"author":"xcode","version":1}}' > ios/Rawh/Assets.xcassets/Contents.json
          echo '{"images":[{"filename":"icon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > ios/Rawh/Assets.xcassets/AppIcon.appiconset/Contents.json
          echo '{"colors":[{"idiom":"universal","color":{"color-space":"srgb","components":{"red":"0.039","green":"0.149","blue":"0.125","alpha":"1.000"}}}],"info":{"author":"xcode","version":1}}' > ios/Rawh/Assets.xcassets/LaunchBG.colorset/Contents.json

          cat > ios/project.yml <<'EOF'
          name: Rawh
          options:
            bundleIdPrefix: com.rawh
            deploymentTarget:
              iOS: "17.0"
          targets:
            Rawh:
              type: application
              platform: iOS
              sources:
                - path: Rawh
              info:
                path: Rawh/Info.plist
                properties:
                  CFBundleDisplayName: "رَوْح"
                  CFBundleShortVersionString: "2.0"
                  CFBundleVersion: "2"
                  CFBundleDevelopmentRegion: ar
                  CFBundleLocalizations: [ar]
                  UILaunchScreen:
                    UIColorName: LaunchBG
                  UIRequiresFullScreen: true
                  UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
                  UIBackgroundModes: [audio]
                  NSLocationWhenInUseUsageDescription: "يستخدم رَوْح موقعك لتحديد اتجاه القبلة بدقة."
                  ITSAppUsesNonExemptEncryption: false
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.rawh.adhkar
                  PRODUCT_NAME: Rawh
                  TARGETED_DEVICE_FAMILY: "1"
                  SWIFT_VERSION: "5.0"
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
          EOF

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -version
          set -o pipefail
          xcodebuild -project Rawh.xcodeproj -target Rawh -sdk iphoneos -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD" || true
          if grep -q "error:" build.log; then
            echo "------ compile errors ------"
            grep -B2 -A3 "error:" build.log | head -n 120
            exit 1
          fi

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Rawh.app Payload/
          zip -qry ../Rawh.ipa Payload
          ls -lh ../Rawh.ipa

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest Rawh.ipa --title "رَوْح — آخر نسخة" --notes "تطبيق آيفون أصلي (SwiftUI). ثبّته عن طريق Sideloadly أو AltStore."
